name: Deploy to VPS

on:
  push:
    branches:
      - KMI  # Deploy otomatis saat push ke branch KMI
  workflow_dispatch:  # Manual trigger dari GitHub UI
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'KMI'
        type: choice
        options:
          - KMI

env:
  NODE_VERSION: '18.x'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || 'KMI' }}
      
      - name: Check package-lock.json exists
        id: check_lockfile
        run: |
          if [ -f "website/package-lock.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.check_lockfile.outputs.exists == 'true' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.check_lockfile.outputs.exists == 'true' && 'website/package-lock.json' || '' }}
      
      - name: Validate GitHub Secrets
        run: |
          echo "🔍 Validating GitHub Secrets..."
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ Error: VPS_HOST secret is not set"
            echo "Please go to Settings > Secrets and variables > Actions and add VPS_HOST"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ Error: VPS_USER secret is not set"
            echo "Please go to Settings > Secrets and variables > Actions and add VPS_USER"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ Error: VPS_SSH_KEY secret is not set"
            echo "Please go to Settings > Secrets and variables > Actions and add VPS_SSH_KEY"
            exit 1
          fi
          echo "✅ All required secrets are set"
          echo "VPS_HOST: ${{ secrets.VPS_HOST }}"
          echo "VPS_USER: ${{ secrets.VPS_USER }}"
          echo "VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-reporting' }}"
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key with proper formatting
          # Use printf to preserve newlines and handle special characters correctly
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Validate SSH key format
          echo "🔍 Validating SSH key format..."
          if ! ssh-keygen -l -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "❌ Error: Invalid SSH key format"
            echo ""
            echo "SSH key validation failed. Common issues:"
            echo "1. Missing -----BEGIN and -----END lines"
            echo "2. Extra spaces or characters at start/end"
            echo "3. Incorrect line breaks"
            echo "4. Key was truncated or corrupted"
            echo ""
            echo "First 100 characters of key:"
            head -c 100 ~/.ssh/deploy_key
            echo ""
            echo ""
            echo "Last 100 characters of key:"
            tail -c 100 ~/.ssh/deploy_key
            echo ""
            exit 1
          fi
          
          # Get key fingerprint for verification
          KEY_FINGERPRINT=$(ssh-keygen -l -f ~/.ssh/deploy_key 2>/dev/null | awk '{print $2}')
          KEY_TYPE=$(ssh-keygen -l -f ~/.ssh/deploy_key 2>/dev/null | awk '{print $4}')
          echo "✅ SSH key is valid"
          echo "📝 Key type: $KEY_TYPE"
          echo "📝 Key fingerprint: $KEY_FINGERPRINT"
          
          # Add host to known_hosts
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
            echo "✅ Added ${{ secrets.VPS_HOST }} to known_hosts"
          fi
      
      - name: Test SSH Connection
        run: |
          echo "🔍 Testing SSH connection to ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}..."
          
          # Test with verbose output for debugging
          SSH_OUTPUT=$(ssh -v -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "echo 'SSH connection successful'" 2>&1)
          SSH_EXIT_CODE=$?
          
          if [ $SSH_EXIT_CODE -eq 0 ]; then
            echo "✅ SSH connection successful"
          else
            echo "❌ SSH connection failed (exit code: $SSH_EXIT_CODE)"
            echo ""
            echo "=== SSH Debug Output ==="
            echo "$SSH_OUTPUT" | grep -E "(debug1|error|Permission denied|publickey|libcrypto)" | head -30
            echo ""
            echo "=== Troubleshooting Steps ==="
            echo "1. ✅ Verify VPS_HOST is correct: ${{ secrets.VPS_HOST }}"
            echo "2. ✅ Verify VPS_USER is correct: ${{ secrets.VPS_USER }}"
            echo "3. ⚠️  Verify VPS_SSH_KEY format:"
            echo "   - Must include -----BEGIN and -----END lines"
            echo "   - No extra spaces at start/end"
            echo "   - All lines properly formatted"
            echo "   - Key must be complete (not truncated)"
            echo "4. ⚠️  Check if PUBLIC key is in VPS authorized_keys:"
            echo "   Run on VPS: cat ~/.ssh/authorized_keys"
            echo "   Should contain matching public key from github_actions_deploy.pub"
            echo "5. ⚠️  Check VPS permissions:"
            echo "   ~/.ssh should be 700: chmod 700 ~/.ssh"
            echo "   ~/.ssh/authorized_keys should be 600: chmod 600 ~/.ssh/authorized_keys"
            echo "6. ⚠️  Check VPS firewall allows SSH (port 22)"
            echo ""
            echo "=== Quick Fix Commands (Run on VPS) ==="
            echo "# Extract public key from private key:"
            echo "ssh-keygen -y -f ~/.ssh/github_actions_deploy"
            echo ""
            echo "# Add to authorized_keys (if not already there):"
            echo "cat ~/.ssh/github_actions_deploy.pub >> ~/.ssh/authorized_keys"
            echo "chmod 600 ~/.ssh/authorized_keys"
            echo ""
            echo "# Verify public key matches:"
            echo "ssh-keygen -y -f ~/.ssh/github_actions_deploy"
            echo "cat ~/.ssh/authorized_keys | grep github-actions"
            exit 1
          fi
      
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-reporting' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << ENDSSH
            set -e  # Exit on error
            
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-reporting' }}"
            echo "🚀 Starting deployment..."
            echo "📍 Deployment path: \$DEPLOY_PATH"
            
            # Check if deployment directory exists
            if [ ! -d "\$DEPLOY_PATH" ]; then
              echo "⚠️  Deployment directory does not exist: \$DEPLOY_PATH"
              echo "📁 Creating directory..."
              sudo mkdir -p "\$DEPLOY_PATH" || {
                echo "❌ Failed to create directory. Trying without sudo..."
                mkdir -p "\$DEPLOY_PATH" || {
                  echo "❌ Failed to create directory: \$DEPLOY_PATH"
                  echo "Please create the directory manually or check permissions"
                  exit 1
                }
              }
              echo "✅ Directory created"
            fi
            
            # Check if it's a git repository
            if [ ! -d "\$DEPLOY_PATH/.git" ]; then
              echo "⚠️  Not a git repository. Checking if we need to clone..."
              if [ -z "\$(ls -A \$DEPLOY_PATH 2>/dev/null)" ]; then
                echo "📥 Directory is empty. You need to clone the repository first."
                echo "Run on VPS:"
                echo "  cd \$(dirname \$DEPLOY_PATH)"
                echo "  git clone YOUR_REPOSITORY_URL \$(basename \$DEPLOY_PATH)"
                echo "  cd \$DEPLOY_PATH"
                echo "  git checkout KMI"
                exit 1
              else
                echo "⚠️  Directory exists but is not a git repository"
                echo "Please ensure repository is cloned to: \$DEPLOY_PATH"
                exit 1
              fi
            fi
            
            # Navigate to deployment directory
            cd "\$DEPLOY_PATH" || {
              echo "❌ Failed to change directory to: \$DEPLOY_PATH"
              exit 1
            }
            echo "✅ Changed to deployment directory: \$(pwd)"
            
            # Backup current database (if exists)
            if [ -f "website/kmi_receiver.db" ]; then
              echo "💾 Backing up database..."
              mkdir -p backups
              cp website/kmi_receiver.db backups/kmi_receiver_backup_$(date +%Y%m%d_%H%M%S).db || true
            fi
            
            # Pull latest code
            echo "📥 Pulling latest code from branch KMI..."
            git fetch origin || {
              echo "⚠️ git fetch failed, trying to initialize if needed..."
              if [ ! -d ".git" ]; then
                echo "❌ Not a git repository. Please ensure repository is cloned first."
                exit 1
              fi
            }
            git checkout KMI || {
              echo "⚠️ Branch KMI not found locally, creating from origin..."
              git checkout -b KMI origin/KMI || exit 1
            }
            git pull origin KMI || {
              echo "⚠️ git pull failed, trying to reset..."
              git reset --hard origin/KMI || exit 1
            }
            
            # Show current commit
            echo "📌 Current commit: $(git rev-parse --short HEAD)"
            echo "📝 Commit message: $(git log -1 --pretty=%B)"
            
            # Check if website directory exists
            if [ ! -d "website" ]; then
              echo "❌ Directory 'website' not found in repository"
              echo "Current directory contents:"
              ls -la
              exit 1
            fi
            
            # Navigate to website directory
            cd website || {
              echo "❌ Failed to change to website directory"
              exit 1
            }
            echo "✅ Changed to website directory: $(pwd)"
            
            # Check if package.json exists
            if [ ! -f "package.json" ]; then
              echo "❌ package.json not found in website directory"
              echo "Current directory contents:"
              ls -la
              exit 1
            fi
            
            # Install/update dependencies
            echo "📦 Installing dependencies..."
            npm install --production --no-audit || {
              echo "⚠️ npm install failed, trying with --legacy-peer-deps..."
              npm install --production --legacy-peer-deps || {
                echo "❌ Failed to install dependencies"
                echo "Checking Node.js and npm versions:"
                node -v || echo "Node.js not found"
                npm -v || echo "npm not found"
                exit 1
              }
            }
            echo "✅ Dependencies installed successfully"
            
            # Check if PM2 process exists
            echo "🔄 Checking PM2 process..."
            if pm2 list | grep -q "mo-receiver-kmi"; then
              echo "✅ PM2 process found, restarting..."
              pm2 restart mo-receiver-kmi
            else
              echo "🆕 PM2 process not found, starting new process..."
              # Start PM2 from website directory
              pm2 start server.js --name mo-receiver-kmi --cwd $(pwd)
            fi
            
            # Save PM2 process list
            pm2 save || echo "⚠️ Failed to save PM2 process list (non-critical)"
            
            # Show PM2 status
            echo "📊 PM2 Status:"
            pm2 status mo-receiver-kmi || echo "⚠️ Failed to get PM2 status"
            
            # Show recent logs
            echo "📋 Recent PM2 logs:"
            pm2 logs mo-receiver-kmi --lines 5 --nostream || echo "⚠️ Failed to get logs"
            
            echo "✅ Deployment completed successfully!"
          ENDSSH
      
      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << ENDSSH
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-reporting' }}"
            
            # Check if directory exists
            if [ ! -d "\$DEPLOY_PATH" ]; then
              echo "❌ Deployment directory does not exist: \$DEPLOY_PATH"
              exit 1
            fi
            
            cd "\$DEPLOY_PATH/website" || {
              echo "❌ Failed to change to website directory"
              exit 1
            }
            
            # Check PM2 process status
            if pm2 list | grep -q "mo-receiver-kmi.*online"; then
              echo "✅ Application is running"
              pm2 logs mo-receiver-kmi --lines 10 --nostream
            else
              echo "❌ Application is not running!"
              pm2 logs mo-receiver-kmi --lines 20
              exit 1
            fi
          ENDSSH
      
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "🧹 Cleanup completed"
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          
          # Check if secrets are set
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "**⚠️ VPS_HOST:** Not configured!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Setup Required" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "GitHub Secrets belum dikonfigurasi. Silakan:" >> $GITHUB_STEP_SUMMARY
            echo "1. Buka **Settings** > **Secrets and variables** > **Actions**" >> $GITHUB_STEP_SUMMARY
            echo "2. Tambahkan secrets berikut:" >> $GITHUB_STEP_SUMMARY
            echo "   - \`VPS_HOST\`: IP address atau domain VPS" >> $GITHUB_STEP_SUMMARY
            echo "   - \`VPS_USER\`: Username SSH (contoh: root, ubuntu)" >> $GITHUB_STEP_SUMMARY
            echo "   - \`VPS_SSH_KEY\`: Private SSH key" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📖 Lihat dokumentasi: [.github/SETUP_SECRETS.md](.github/SETUP_SECRETS.md)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Deployed to:** \`${{ secrets.VPS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Path:** \`${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-reporting' }}/website\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Status:** Deployment successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deployment failed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Troubleshooting" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Cek logs di atas untuk detail error" >> $GITHUB_STEP_SUMMARY
            echo "2. Pastikan semua GitHub Secrets sudah dikonfigurasi" >> $GITHUB_STEP_SUMMARY
            echo "3. Pastikan VPS bisa diakses via SSH" >> $GITHUB_STEP_SUMMARY
            echo "4. Lihat dokumentasi: [.github/SETUP_SECRETS.md](.github/SETUP_SECRETS.md)" >> $GITHUB_STEP_SUMMARY
          fi
