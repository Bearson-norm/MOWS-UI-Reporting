name: Deploy to VPS

on:
  push:
    branches:
      - KMI  # Deploy otomatis saat push ke branch KMI
  workflow_dispatch:  # Manual trigger dari GitHub UI
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'KMI'
        type: choice
        options:
          - KMI

env:
  NODE_VERSION: '18.x'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || 'KMI' }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"
      
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-receiver' }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e  # Exit on error
            
            echo "🚀 Starting deployment..."
            echo "📍 Deployment path: ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-receiver' }}"
            
            # Navigate to deployment directory
            cd ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-receiver' }}
            
            # Backup current database (if exists)
            if [ -f "website/kmi_receiver.db" ]; then
              echo "💾 Backing up database..."
              mkdir -p backups
              cp website/kmi_receiver.db backups/kmi_receiver_backup_$(date +%Y%m%d_%H%M%S).db || true
            fi
            
            # Pull latest code
            echo "📥 Pulling latest code from branch KMI..."
            git fetch origin
            git checkout KMI
            git pull origin KMI
            
            # Show current commit
            echo "📌 Current commit: $(git rev-parse --short HEAD)"
            echo "📝 Commit message: $(git log -1 --pretty=%B)"
            
            # Navigate to website directory
            cd website
            
            # Install/update dependencies
            echo "📦 Installing dependencies..."
            npm install --production --no-audit
            
            # Check if PM2 process exists
            echo "🔄 Checking PM2 process..."
            if pm2 list | grep -q "mo-receiver-kmi"; then
              echo "✅ PM2 process found, restarting..."
              pm2 restart mo-receiver-kmi
            else
              echo "🆕 PM2 process not found, starting new process..."
              cd ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-receiver' }}/website
              pm2 start server.js --name mo-receiver-kmi --cwd ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-receiver' }}/website
            fi
            
            # Save PM2 process list
            pm2 save
            
            # Show PM2 status
            echo "📊 PM2 Status:"
            pm2 status mo-receiver-kmi
            
            echo "✅ Deployment completed successfully!"
          ENDSSH
      
      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-receiver' }}
            
            # Check PM2 process status
            if pm2 list | grep -q "mo-receiver-kmi.*online"; then
              echo "✅ Application is running"
              pm2 logs mo-receiver-kmi --lines 10 --nostream
            else
              echo "❌ Application is not running!"
              pm2 logs mo-receiver-kmi --lines 20
              exit 1
            fi
          ENDSSH
      
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "🧹 Cleanup completed"
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed to:** \`${{ secrets.VPS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Path:** \`${{ secrets.VPS_DEPLOY_PATH || '/opt/mo-receiver' }}/website\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Status:** Deployment successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deployment failed!" >> $GITHUB_STEP_SUMMARY
          fi
